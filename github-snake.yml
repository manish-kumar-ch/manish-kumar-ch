name: Generate contribution snake
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/github-snake.yml'
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate cyan snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: manish-kumar-ch
          outputs: |
            dist/github-snake.svg?color_snake=#00B4D8&color_dots=#e8f8fc,#b2e8f3,#66d2e8,#00B4D8,#007f99
            dist/github-snake-dark.svg?color_snake=#00B4D8&color_dots=#102e46,#00566b,#0086a1,#00B4D8,#80daec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
