<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="620" height="290" viewBox="0 0 620 290" role="img" aria-label="Public GitHub stats snapshot, 11 October 2026"><title>Public GitHub stats snapshot, 11 October 2026</title><style>:root{--bg:#071b2d;--card:#102e46;--text:#edf8ff;--muted:#a8cadf;--line:#315773}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.pop{animation:pop .65s both;transform-box:fill-box;transform-origin:center}.pill{animation:appear .8s both;transition:filter .2s}.pill:hover{filter:drop-shadow(0 0 7px #00B4D8)}.blink{animation:blink 1s steps(1) infinite}.neon{animation:flicker 6s infinite}.orb{animation:pulse 5s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes pop{from{opacity:0;transform:scale(.5) translateY(12px)}to{opacity:1;transform:none}}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.06}50%{opacity:.14}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes flicker{0%,4%,8%{opacity:.2}2%,6%,10%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="pink"><stop stop-color="#00B4D8"><animate attributeName="stop-color" values="#00B4D8;#00B4D8;#00B4D8" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#00B4D8"><animate attributeName="stop-color" values="#00B4D8;#00B4D8;#00B4D8" dur="5s" repeatCount="indefinite"/></stop></linearGradient><filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="outer"><rect x="0" y="0" width="620" height="290" rx="24" fill="white" /></clipPath></defs><g clip-path="url(#outer)"><rect x="0" y="0" width="620" height="290" rx="24" fill="var(--bg)" /><text x="28" y="38" font-size="16" fill="var(--text)" >OPEN SOURCE / SNAPSHOT</text><text x="28" y="63" font-size="12" fill="var(--muted)" >11 OCT 2026 · public GitHub API</text><circle cx="497" cy="160" r="67" stroke="var(--line)" stroke-width="7" fill="none"/><circle cx="497" cy="160" r="67" stroke="url(#pink)" stroke-width="7" fill="none" stroke-dasharray="421" stroke-dashoffset="0" transform="rotate(-90 497 160)"><animate attributeName="stroke-dashoffset" from="421" to="0" dur="2s" fill="freeze"/></circle><text x="497" y="161" font-size="18" fill="#00B4D8" text-anchor="middle">BUILDER</text><text x="497" y="184" font-size="10" fill="var(--muted)" text-anchor="middle">CUSTOM TIER</text><g class="pill" style="animation-delay:0.0s"><text x="28" y="109" font-size="17" fill="var(--muted)" >Public repositories</text><text x="338" y="109" font-size="21" fill="#00B4D8" text-anchor="end">4</text></g><g class="pill" style="animation-delay:0.2s"><text x="28" y="148" font-size="17" fill="var(--muted)" >Stars received</text><text x="338" y="148" font-size="21" fill="#00B4D8" text-anchor="end">0</text></g><g class="pill" style="animation-delay:0.4s"><text x="28" y="187" font-size="17" fill="var(--muted)" >Followers</text><text x="338" y="187" font-size="21" fill="#00B4D8" text-anchor="end">0</text></g><g class="pill" style="animation-delay:0.6000000000000001s"><text x="28" y="226" font-size="17" fill="var(--muted)" >Repository languages</text><text x="338" y="226" font-size="21" fill="#00B4D8" text-anchor="end">5</text></g></g></svg>