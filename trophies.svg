<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="195" viewBox="0 0 1280 195" role="img" aria-label="Custom milestone trophies based on verified public repository data"><title>Custom milestone trophies based on verified public repository data</title><style>:root{--bg:#071b2d;--card:#102e46;--text:#edf8ff;--muted:#a8cadf;--line:#315773}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.pop{animation:pop .65s both;transform-box:fill-box;transform-origin:center}.pill{animation:appear .8s both;transition:filter .2s}.pill:hover{filter:drop-shadow(0 0 7px #00B4D8)}.blink{animation:blink 1s steps(1) infinite}.neon{animation:flicker 6s infinite}.orb{animation:pulse 5s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes pop{from{opacity:0;transform:scale(.5) translateY(12px)}to{opacity:1;transform:none}}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.06}50%{opacity:.14}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes flicker{0%,4%,8%{opacity:.2}2%,6%,10%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="pink"><stop stop-color="#00B4D8"><animate attributeName="stop-color" values="#00B4D8;#00B4D8;#00B4D8" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#00B4D8"><animate attributeName="stop-color" values="#00B4D8;#00B4D8;#00B4D8" dur="5s" repeatCount="indefinite"/></stop></linearGradient><filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="outer"><rect x="0" y="0" width="1280" height="195" rx="24" fill="white" /></clipPath></defs><g clip-path="url(#outer)"><rect x="0" y="0" width="1280" height="195" rx="24" fill="var(--bg)" /><text x="28" y="33" font-size="15" fill="var(--text)" >MILESTONES / CUSTOM TROPHIES</text><text x="1252" y="33" font-size="12" fill="var(--muted)" text-anchor="end">11 OCT 2026 · not official GitHub ranks</text><g class="pop" style="animation-delay:0.0s"><rect x="28" y="54" width="288" height="117" rx="16" fill="var(--card)" /><text x="50" y="103" font-size="34" fill="#00B4D8" filter="url(#glow)">04</text><text x="121" y="91" font-size="13" fill="var(--text)" >REPOSITORIES</text><text x="121" y="116" font-size="12" fill="var(--muted)" >Public projects</text><text x="50" y="147" font-size="21" fill="#00B4D8" >✦</text></g><g class="pop" style="animation-delay:0.18s"><rect x="340" y="54" width="288" height="117" rx="16" fill="var(--card)" /><text x="362" y="103" font-size="34" fill="#00B4D8" filter="url(#glow)">05</text><text x="433" y="91" font-size="13" fill="var(--text)" >POLYGLOT</text><text x="433" y="116" font-size="12" fill="var(--muted)" >Repository languages</text><text x="362" y="147" font-size="21" fill="#00B4D8" >✦</text></g><g class="pop" style="animation-delay:0.36s"><rect x="652" y="54" width="288" height="117" rx="16" fill="var(--card)" /><text x="674" y="103" font-size="34" fill="#00B4D8" filter="url(#glow)">01</text><text x="745" y="91" font-size="13" fill="var(--text)" >PORTFOLIO</text><text x="745" y="116" font-size="12" fill="var(--muted)" >Published repository</text><text x="674" y="147" font-size="21" fill="#00B4D8" >✦</text></g><g class="pop" style="animation-delay:0.54s"><rect x="964" y="54" width="288" height="117" rx="16" fill="var(--card)" /><text x="986" y="103" font-size="34" fill="#00B4D8" filter="url(#glow)">01</text><text x="1057" y="91" font-size="13" fill="var(--text)" >PYTHON BUILDER</text><text x="1057" y="116" font-size="12" fill="var(--muted)" >Paper-fetcher</text><text x="986" y="147" font-size="21" fill="#00B4D8" >✦</text></g><rect x="-200" y="52" width="170" height="120" fill="url(#shine)"><animate attributeName="x" from="-200" to="1280" dur="6s" repeatCount="indefinite"/></rect></g></svg>